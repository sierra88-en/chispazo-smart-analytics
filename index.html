
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chispazo AI Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      .mono { font-family: 'JetBrains Mono', monospace; }

      @keyframes swarm-sway {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(0.4deg); }
        50% { transform: rotate(-0.4deg); }
        75% { transform: rotate(0.2deg); }
        100% { transform: rotate(0deg); }
      }
      .animate-swarm-active {
        animation: swarm-sway 10s ease-in-out infinite;
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 25s linear infinite;
      }

      /* =========================================================
         MODO DE INSPECCIÓN DIURNA (ALTO CONTRASTE BAJO SOL / LUZ)
         ========================================================= */
      body.theme-inspection-day {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
      }

      .theme-inspection-day .bg-slate-950 {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      .theme-inspection-day .bg-slate-900 {
        background-color: #ffffff !important;
        color: #0f172a !important;
      }

      .theme-inspection-day .bg-slate-900\/95,
      .theme-inspection-day .bg-slate-900\/90,
      .theme-inspection-day .bg-slate-900\/80,
      .theme-inspection-day .bg-slate-900\/70,
      .theme-inspection-day .bg-slate-900\/60,
      .theme-inspection-day .bg-slate-900\/50,
      .theme-inspection-day .bg-slate-900\/40 {
        background-color: rgba(255, 255, 255, 0.96) !important;
        color: #0f172a !important;
      }

      .theme-inspection-day .bg-slate-900\/30,
      .theme-inspection-day .bg-slate-900\/20,
      .theme-inspection-day .bg-slate-950\/80,
      .theme-inspection-day .bg-slate-950\/60,
      .theme-inspection-day .bg-slate-950\/40 {

      .theme-inspection-day .bg-slate-800,

      .theme-inspection-day .bg-slate-800\/70,

      .theme-inspection-day .bg-slate-800\/40 {
        background-color: #f1f5f9 !important;

      }

      .theme-inspection-day .text-white {
        color: #0f172a !important;
      }

      .theme-inspection-day .text-slate-100,
      .theme-inspection-day .text-slate-200,
      .theme-inspection-day .text-slate-300 {
        color: #1e293b !important;
      }

      .theme-inspection-day .text-slate-400 {
        color: #334155 !important;
      }

      .theme-inspection-day .text-slate-500 {
        color: #475569 !important;
      }

      .theme-inspection-day .border-slate-800,
      .theme-inspection-day .border-slate-800\/80,
      .theme-inspection-day .border-slate-800\/60,
      .theme-inspection-day .border-slate-800\/50,
      .theme-inspection-day .border-slate-700,
      .theme-inspection-day .border-slate-700\/80,
      .theme-inspection-day .border-slate-700\/50,
      .theme-inspection-day .border-slate-900 {
        border-color: #cbd5e1 !important;
      }

      .theme-inspection-day .hover\:bg-slate-800:hover {
        background-color: #e2e8f0 !important;
        color: #020617 !important;
      }

      .theme-inspection-day .hover\:bg-slate-900:hover {
        background-color: #f8fafc !important;
        color: #020617 !important;
      }

      .theme-inspection-day .hover\:text-white:hover {
        color: #000000 !important;
      }

      .theme-inspection-day .shadow-inner {
        box-shadow: inset 0 2px 4px 0 rgba(0, 0, 0, 0.06) !important;
      }

      .theme-inspection-day .shadow-2xl,
      .theme-inspection-day .shadow-xl {
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04) !important;
      }
